aid: manufactured
name: Manufactured
description: >-
  Manufactured is a supply-chain and production platform for hardware and consumer-product
  brands, backed by Bullpen Capital. Its web application (app.manufactured.com) helps teams
  run overseas production end to end — issuing sourcing requests to vendors, managing supplier
  and vendor profiles, negotiating order estimates and contracts under master procurement
  agreements, tracking production timelines and calendars, and financing purchase orders through
  production and repayment terms. The product also embeds an AI assistant built on LangChain.
  At the time of enrichment the public marketing site and the api/docs/developer subdomains were
  unreachable, and the GraphQL, Lambda and bot backends are private and authentication-gated
  (introspection blocked), so no public API specification, developer portal, or documentation
  could be harvested. This profile captures the real, observable surface only.
